<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Verify a document</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#f3f5f7; --surface:#ffffff; --ink:#14212b; --muted:#5b6b78; --line:#dde3e8;
  --ph:#7a8895; --ph-bg:#eef1f4; --accent:#1f4e6b; --on-accent:#ffffff;
  --ok:#17794a; --ok-bg:#e4f4ec; --wait:#9a6200; --wait-bg:#fbf0d9; --bad:#b3261e; --bad-bg:#fbe7e5;
  color-scheme: light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e161c; --surface:#16212a; --ink:#e8eef2; --muted:#9bacb8; --line:#2a3944;
    --ph:#8d9eab; --ph-bg:#1f2c36; --accent:#8cc4e6; --on-accent:#0e161c;
    --ok:#5fd09a; --ok-bg:#12372a; --wait:#f0b84d; --wait-bg:#3a2c0e; --bad:#ff8f86; --bad-bg:#40191a;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e161c; --surface:#16212a; --ink:#e8eef2; --muted:#9bacb8; --line:#2a3944;
  --ph:#8d9eab; --ph-bg:#1f2c36; --accent:#8cc4e6; --on-accent:#0e161c;
  --ok:#5fd09a; --ok-bg:#12372a; --wait:#f0b84d; --wait-bg:#3a2c0e; --bad:#ff8f86; --bad-bg:#40191a;
  color-scheme: dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0; background:var(--bg); color:var(--ink); font:400 16px/1.55 "IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; min-height:100vh; padding:28px 16px 48px}
main{max-width:680px; margin:0 auto}
header{display:flex; align-items:center; gap:10px; margin-bottom:18px; font-weight:600; color:var(--accent)}
.mark{width:28px; height:28px; border-radius:6px; background:var(--accent); color:var(--on-accent); display:grid; place-items:center; font-size:15px}
.lookup{display:flex; gap:8px; margin-bottom:8px}
.lookup label{position:absolute; left:-9999px}
input{flex:1; min-width:0; font:inherit; color:var(--ink); background:var(--surface); border:1px solid var(--line); border-radius:8px; padding:11px 14px}
button{font:inherit; cursor:pointer}
.go{background:var(--accent); color:var(--on-accent); border:0; border-radius:8px; padding:11px 20px; font-weight:600}
:focus-visible{outline:3px solid var(--accent); outline-offset:2px}
.hint{display:flex; flex-wrap:wrap; gap:6px 8px; align-items:center; margin:0 0 18px; color:var(--muted); font-size:.875rem}
.chip{font-size:.8125rem; color:var(--ink); background:var(--surface); border:1px solid var(--line); border-radius:999px; padding:3px 11px}
.card{background:var(--surface); border:1px solid var(--line); border-radius:12px; overflow:hidden}
.status{display:flex; gap:14px; align-items:flex-start; padding:20px 24px; border-bottom:1px solid var(--line); color:var(--muted); background:var(--ph-bg)}
.card[data-status="verified"] .status{color:var(--ok); background:var(--ok-bg)}
.card[data-status="expired"] .status{color:var(--wait); background:var(--wait-bg)}
.card[data-status="revoked"] .status,.card[data-status="notfound"] .status{color:var(--bad); background:var(--bad-bg)}
.icon{flex:none; width:36px; height:36px; border-radius:50%; background:currentColor; display:grid; place-items:center}
.icon svg{width:20px; height:20px; stroke:var(--surface); fill:none; stroke-width:2.5; stroke-linecap:round; stroke-linejoin:round}
h1{margin:0; font-size:1.3rem; line-height:1.25; font-weight:600; color:var(--ink)}
.status p{margin:4px 0 0; font-size:.9375rem; color:var(--ink); opacity:.8}
.body{padding:20px 24px 12px}
.identity{display:flex; gap:16px; align-items:center; padding-bottom:16px; border-bottom:1px solid var(--line)}
.avatar{flex:none; width:64px; height:80px; border-radius:8px; background:var(--ph-bg); color:var(--ph); display:grid; place-items:center; font-weight:600; font-size:1.25rem; border:1px solid var(--line)}
.card[data-kind="Certificate"] .avatar{display:none}
.title{margin:0; font-size:1.125rem; font-weight:600; line-height:1.3}
.type{display:inline-block; margin-top:6px; font-size:.8125rem; color:var(--accent); border:1px solid var(--accent); border-radius:999px; padding:1px 10px}
dl{margin:0}
.row{display:grid; grid-template-columns:minmax(120px,36%) 1fr; gap:4px 16px; padding:12px 0; border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
dt{color:var(--muted); font-size:.9375rem}
dd{margin:0; font-weight:500; overflow-wrap:anywhere}
.ph{color:var(--ph); background:var(--ph-bg); border-radius:4px; padding:1px 7px; font-weight:400}
.foot{padding:14px 24px; background:var(--ph-bg); color:var(--muted); font-size:.875rem; border-top:1px solid var(--line)}
.foot a{color:var(--accent)}
@media (max-width:480px){.row{grid-template-columns:1fr}.status,.body,.foot{padding-left:18px; padding-right:18px}.go{padding:11px 14px}}
</style>
</head>
<body>
<main>
  <header><span class="mark" aria-hidden="true">✓</span><span id="org">Organization name</span></header>

  <div class="lookup">
    <label for="ref">Reference number</label>
    <input id="ref" type="text" placeholder="Enter reference number" autocomplete="off" autocapitalize="characters" spellcheck="false">
    <button class="go" id="go" type="button">Verify</button>
  </div>
  <p class="hint">Try a sample: <span id="samples"></span></p>

  <section class="card" id="card" data-status="idle" data-kind="Certificate" aria-live="polite">
    <div class="status">
      <span class="icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path id="ico" d="M12 7v6M12 17h.01"/></svg></span>
      <div><h1 id="st">Enter a reference number</h1><p id="sm">Details and verification status appear here.</p></div>
    </div>
    <div class="body">
      <div class="identity">
        <div class="avatar" id="av" aria-hidden="true">?</div>
        <div><p class="title" id="f-title"></p><span class="type" id="f-type"></span></div>
      </div>
      <dl>
        <div class="row"><dt>Reference number</dt><dd id="f-ref"></dd></div>
        <div class="row"><dt>Holder name</dt><dd id="f-holder"></dd></div>
        <div class="row"><dt>Issuing organization</dt><dd id="f-org"></dd></div>
        <div class="row"><dt>Issue date</dt><dd id="f-issued"></dd></div>
        <div class="row"><dt>Expiry date</dt><dd id="f-expires"></dd></div>
      </dl>
    </div>
    <div class="foot">Questions about this result? Contact <a id="mail" href="#"></a>.</div>
  </section>
</main>

<script>
/* ===== Edit this block to reuse the template ===== */
var CONFIG = {
  orgName: "Northfield Institute",
  supportEmail: "verify@example.com",
  /* type: "Certificate" or "ID card". status: "active" or "revoked". Dates: YYYY-MM-DD, or "" for no expiry. */
  records: [
    {ref:"CERT-2025-0142", title:"Advanced Project Management", type:"Certificate", holder:"Amara Okafor", org:"Northfield Institute", issued:"2025-03-14", expires:"2028-03-14", status:"active"},
    {ref:"ID-88-4521", title:"Staff identification card", type:"ID card", holder:"Daniel Reyes", org:"Northfield Institute", issued:"2026-01-08", expires:"2029-01-08", status:"active"},
    {ref:"CERT-2022-0031", title:"Food Safety Level 2", type:"Certificate", holder:"Priya Nair", org:"Northfield Institute", issued:"2022-05-02", expires:"2024-05-02", status:"active"},
    {ref:"CERT-2024-0310", title:"First Aid at Work", type:"Certificate", holder:"Lena Fischer", org:"Northfield Institute", issued:"2024-09-20", expires:"", status:"revoked"}
  ]
};
/* ================================================= */

var $ = function(id){ return document.getElementById(id); };
var ICON = {idle:"M12 7v6M12 17h.01", verified:"M5 12.5l4.5 4.5L19 7.5", expired:"M12 6v6l4 2", revoked:"M7 7l10 10M17 7L7 17", notfound:"M7 7l10 10M17 7L7 17"};
var COPY = {
  idle:["Enter a reference number","Details and verification status appear here."],
  verified:["Document verified","This document is authentic and matches our records."],
  expired:["Document expired","This document is authentic, but it is past its expiry date."],
  revoked:["Document revoked","The issuer has withdrawn this document. Do not accept it."],
  notfound:["No record found","Check the reference number and try again."]
};
var PH = {title:"[Document Title]", type:"[Document Type]", ref:"[Reference Number]", holder:"[Holder Name]", org:"[Issuing Organization]", issued:"[Issue Date]", expires:"[Expiry Date]"};

function fmt(d){
  if(!d) return null;
  var t = new Date(d + "T00:00:00Z");
  return isNaN(t) ? d : t.toLocaleDateString("en-GB", {day:"numeric", month:"long", year:"numeric", timeZone:"UTC"});
}
function put(id, val, ph){
  var el = $(id); el.textContent = ""; 
  if(val){ el.textContent = val; el.classList.remove("ph"); }
  else { var s = document.createElement("span"); s.className = "ph"; s.textContent = ph; el.appendChild(s); }
}
function statusOf(r){
  if(!r) return "notfound";
  if(r.status === "revoked") return "revoked";
  if(r.expires && r.expires < new Date().toISOString().slice(0,10)) return "expired";
  return "verified";
}
function render(r, state){
  var card = $("card");
  card.setAttribute("data-status", state);
  card.setAttribute("data-kind", r ? r.type : "Certificate");
  $("st").textContent = COPY[state][0];
  $("sm").textContent = COPY[state][1];
  $("ico").setAttribute("d", ICON[state]);
  r = r || {};
  put("f-title", r.title, PH.title); put("f-type", r.type, PH.type); put("f-ref", r.ref, PH.ref);
  put("f-holder", r.holder, PH.holder); put("f-org", r.org, PH.org);
  put("f-issued", fmt(r.issued), PH.issued);
  put("f-expires", r.ref ? (fmt(r.expires) || "No expiry") : null, PH.expires);
  $("av").textContent = r.holder ? r.holder.split(/\s+/).map(function(w){return w[0];}).slice(0,2).join("").toUpperCase() : "?";
}
function verify(q){
  q = (q || "").trim().toUpperCase();
  if(!q){ render(null, "idle"); return; }
  var r = CONFIG.records.filter(function(x){ return x.ref.toUpperCase() === q; })[0];
  render(r || null, statusOf(r));
  if(!r){ put("f-ref", q, PH.ref); }
  try{ history.replaceState(null, "", "#" + encodeURIComponent(q)); }catch(e){}
}

$("org").textContent = CONFIG.orgName;
$("mail").textContent = CONFIG.supportEmail; $("mail").href = "mailto:" + CONFIG.supportEmail;
CONFIG.records.forEach(function(r){
  var b = document.createElement("button"); b.type = "button"; b.className = "chip"; b.textContent = r.ref;
  b.onclick = function(){ $("ref").value = r.ref; verify(r.ref); };
  $("samples").appendChild(b); $("samples").appendChild(document.createTextNode(" "));
});
$("go").onclick = function(){ verify($("ref").value); };
$("ref").addEventListener("keydown", function(e){ if(e.key === "Enter") verify($("ref").value); });

function fromHash(){
  var h = ""; try{ h = decodeURIComponent(location.hash.slice(1)); }catch(e){}
  if(h){ $("ref").value = h; verify(h); } else { render(null, "idle"); }
}
window.addEventListener("hashchange", fromHash);
fromHash();
</script>
</body>
</html>
